<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магнат — онлайн-игра на 2–12 игроков</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎩%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#e4ebe8;--panel:#ffffff;--text:#13221e;--muted:#5b6e67;--tile:#f2f5f3;--line:#16322b;
  --center:#0e4a41;--center-text:#e8f5ee;--brass:#f2c14e;--accent:#0f7a5f;--accent-text:#ffffff;
  --btn:#ffffff;--btn-bd:#b7c8c1;--overlay:rgba(7,20,16,.64);--danger:#c53a3a;
  --bs0:min(calc(100vw - 410px),calc(100vh - 28px));
  --bs:var(--bs0);
  --u:calc(var(--bs)/100);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#09130f;--panel:#13211c;--text:#e4efea;--muted:#88a197;--tile:#192a24;--line:#040a08;
    --center:#0a3a33;--btn:#1a2d27;--btn-bd:#32504a;--overlay:rgba(0,0,0,.72);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09130f;--panel:#13211c;--text:#e4efea;--muted:#88a197;--tile:#192a24;--line:#040a08;
  --center:#0a3a33;--btn:#1a2d27;--btn-bd:#32504a;--overlay:rgba(0,0,0,.72);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.conn{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:var(--danger);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.app{display:flex;gap:14px;padding:14px;justify-content:center;align-items:flex-start}
.side{width:380px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;gap:10px;position:sticky;top:14px}
.head{display:flex;align-items:center;gap:8px}
.logo{font-family:'Unbounded',sans-serif;font-weight:800;font-size:22px;letter-spacing:.02em;flex:1;margin:0}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);font-size:17px;cursor:pointer}
.ibtn:hover{border-color:var(--accent)}
.ibtn:disabled{opacity:.4;cursor:not-allowed}
.ibtn:focus-visible,.btn:focus-visible,.tkbtn:focus-visible,.chip:focus-visible,.mb button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto;max-height:46vh;padding:3px}
.pc{display:flex;gap:9px;padding:8px;border-radius:14px;background:var(--panel);border:2px solid transparent;position:relative;min-width:0;transition:border-color .25s,transform .25s}
.pc.cur{border-color:var(--pc);transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.pc.out{opacity:.4;filter:grayscale(1)}
.pc.me .pn::after{content:' · ты';color:var(--muted);font-weight:400}
.pc.off .tk{opacity:.45}
.tk{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.pi{min-width:0;flex:1}
.pn{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cash{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.dot{width:9px;height:9px;border-radius:2px;display:block;border:1px solid rgba(0,0,0,.25)}
.dot.m{opacity:.3}
.float{position:absolute;right:8px;top:4px;font-weight:700;font-size:15px;pointer-events:none;animation:flt 1.4s ease-out forwards}
.float.up{color:#12a05a}.float.dn{color:#d63a3a}
@keyframes flt{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
/* журнал — выдвижная шторка */
.logwrap{background:var(--panel);border-radius:14px;overflow:hidden;flex:none}
.logbar{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:0;background:transparent;color:var(--text);font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.logbar:focus-visible{outline:3px solid var(--brass);outline-offset:-3px}
.lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;color:var(--muted);font-size:13px}
.lbn{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.lbc{transition:transform .2s;color:var(--muted)}
.logwrap.open .lbc{transform:rotate(180deg)}
.logwrap.open .lbl{display:none}
.logbox{max-height:min(38vh,320px);overflow:auto;padding:4px 12px 10px;font-size:13px;line-height:1.35;border-top:1px solid rgba(127,150,140,.2)}
.lg{padding:3px 0;border-bottom:1px solid rgba(127,150,140,.18);animation:lgin .35s}
.lg:last-child{border-bottom:0}
.ld{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
@keyframes lgin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

.board{position:relative;width:var(--bs);height:var(--bs);flex:none;display:grid;
  grid-template-columns:1.45fr repeat(9,1fr) 1.45fr;grid-template-rows:1.45fr repeat(9,1fr) 1.45fr;
  gap:1px;background:var(--line);border:3px solid var(--line);border-radius:calc(var(--u)*1.6);overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.tile{background:var(--tile);position:relative;display:flex;overflow:hidden;text-align:center;
  font-size:max(6.5px,calc(var(--u)*1.18*var(--tf,1)));line-height:1.12;cursor:pointer;min-width:0;min-height:0}
.tile.s-b{flex-direction:column}.tile.s-t{flex-direction:column-reverse}
.tile.s-l{flex-direction:row-reverse}.tile.s-r{flex-direction:row}
.band{flex:none;display:flex;align-items:center;justify-content:center;gap:1px}
.s-b .band,.s-t .band{height:22%}.s-l .band,.s-r .band{width:22%;flex-direction:column}
.hs{display:flex;gap:1px;align-items:center;justify-content:center}
.s-l .hs,.s-r .hs{flex-direction:column}
.h{display:block;width:calc(var(--u)*1.15);height:calc(var(--u)*1.15);background:#2fcf6a;border:1px solid #0b6b32;border-radius:2px}
.h.hotel{width:calc(var(--u)*2.2);background:#e8433b;border-color:#7d1410}
.s-l .h.hotel,.s-r .h.hotel{width:calc(var(--u)*1.15);height:calc(var(--u)*2.2)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3%;min-width:0;overflow:hidden}
.nm{font-weight:600;overflow-wrap:anywhere;hyphens:auto}
.nm.big{font-family:'Unbounded',sans-serif;font-weight:800;font-size:1.25em}
.pr{color:var(--muted);font-size:.92em;margin-top:2px}
.ic{font-size:calc(var(--u)*2.5);line-height:1;margin-bottom:2px}
.t-go .ic,.t-jail .ic,.t-parking .ic,.t-gojail .ic{font-size:calc(var(--u)*4)}
.tile.owned::after{content:'';position:absolute;inset:0;border:calc(var(--u)*.55) solid var(--oc);pointer-events:none;border-radius:2px}
.tile.mort .tb,.tile.mort .band{opacity:.35;filter:grayscale(1)}
.tile.mort{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,127,127,.22) 6px 8px)}
.tile.pop{animation:tpop .5s}
@keyframes tpop{30%{transform:scale(1.12);z-index:3;box-shadow:0 0 0 3px var(--brass)}100%{transform:none}}

.center{grid-row:2/11;grid-column:2/11;background:var(--center);color:var(--center-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*1.5);position:relative;overflow:hidden;
  background-image:radial-gradient(circle at 50% 35%,rgba(255,255,255,.08),transparent 65%)}
.center .mark{font-family:'Unbounded',sans-serif;font-weight:800;font-size:max(18px,calc(var(--u)*6.5));letter-spacing:.06em;color:var(--brass);margin:0;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.banner{min-height:1.4em;font-weight:600;font-size:max(13px,calc(var(--u)*2));text-align:center}
.banner.in{animation:bn .45s}
@keyframes bn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.dice{display:flex;gap:calc(var(--u)*2.2);perspective:600px}
.die{--ds:clamp(30px,calc(var(--u)*8),70px);width:var(--ds);height:var(--ds);background:#fbfbf7;border-radius:18%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 -3px 0 rgba(0,0,0,.12)}
.die i{display:block}
.pip{width:78%;height:78%;border-radius:50%;background:#1b1b1b;place-self:center}
.die.rolling{animation:roll .8s cubic-bezier(.3,.7,.4,1)}
.die:nth-child(2).rolling{animation-name:roll2}
@keyframes roll{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-28px) rotate(260deg)}60%{transform:translateY(0) rotate(520deg)}78%{transform:translateY(-9px) rotate(660deg)}100%{transform:translateY(0) rotate(720deg)}}
@keyframes roll2{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-22px) rotate(-300deg)}60%{transform:translateY(0) rotate(-560deg)}78%{transform:translateY(-7px) rotate(-680deg)}100%{transform:translateY(0) rotate(-720deg)}}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px;align-items:center}
.think{font-size:14px;opacity:.9;animation:bn .4s}
.cd{font-size:12px;opacity:.75;width:100%;text-align:center}
.deed{background:#fffdf6;color:#1b1b1b;border-radius:10px;width:min(240px,100%);overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.35);font-size:12px;text-align:center;animation:bn .4s}
.deed .dh{padding:7px 8px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);font-size:14px}
.deed .dp{padding:5px 8px 0;font-weight:700;font-size:14px}
.deed .dr{padding:3px 8px 7px;color:#444;line-height:1.35}

/* три карты по числу игроков */
.board[data-map="large"]{--bs:calc(var(--bs0)*1.1);--u:calc(var(--bs)/100)}
.board[data-map="xl"]{--bs:calc(var(--bs0)*1.2);--u:calc(var(--bs)/100)}
.board[data-map="mega"]{--bs:calc(var(--bs0)*1.3);--u:calc(var(--bs)/100)}
/* панель прямо в центре стола: аукцион, обмен, карточки */
.cpanel{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(var(--u)*1.6);overflow:auto;text-align:center;color:var(--center-text);
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.10),transparent 70%),var(--center);animation:bn .35s}
.cpanel[hidden]{display:none}
.cpanel h3{margin:0;font-family:'Unbounded',sans-serif;font-weight:600;font-size:max(15px,calc(var(--u)*2.2))}
.cpanel .muted,.cpanel .who{color:var(--center-text);opacity:.8}
.cpanel .flip{width:min(100%,360px)}
.cpanel .row.ctr{justify-content:center;margin-top:4px}
.ofcols{display:flex;gap:10px;align-items:stretch;justify-content:center;width:100%}
.ofside{flex:1;min-width:0;background:rgba(0,0,0,.28);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:center}
.ofh{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.tkx{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:13px;border:1.5px solid #fff}
.ofarrow{align-self:center;font-size:22px;opacity:.8}
.tchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-size:13px}
.tchip.cash{background:rgba(242,193,78,.25)}
.need{background:rgba(197,58,58,.35);border:1px solid #ff9a9a;border-radius:10px;padding:8px 10px;font-size:13px;width:100%}
/* подсветка клеток: обмен, аукцион и покупка */
.tile.hl,.tile.hl-auc{z-index:5;animation:hlpulse .8s ease-in-out infinite}
.tile[data-hl]::before{content:attr(data-hl);position:absolute;left:0;right:0;top:0;z-index:7;background:rgba(0,0,0,.82);color:#fff;font-weight:700;font-size:max(7px,calc(var(--u)*1.05));padding:1px 2px;text-align:center;pointer-events:none}
@keyframes hlpulse{0%,100%{box-shadow:inset 0 0 0 calc(var(--u)*.5) #ffd166;transform:scale(1)}50%{box-shadow:inset 0 0 0 calc(var(--u)*1.2) #ffd166,0 0 calc(var(--u)*3) #ffd166;transform:scale(1.1)}}
.tile.flash{z-index:6;animation:buyflash .5s ease-in-out 5}
@keyframes buyflash{0%,100%{box-shadow:inset 0 0 0 0 var(--oc);transform:none}50%{box-shadow:inset 0 0 0 calc(var(--u)*1.8) var(--oc),0 0 calc(var(--u)*3) var(--oc);filter:brightness(1.3) saturate(1.4);transform:scale(1.14)}}
.btn.mini{padding:6px 10px;font-size:12px;margin-top:6px}
/* темы доски (личная настройка) */
.board{color:var(--text)}
.board[data-theme="night"]{--line:#070b1c;--tile:#131a36;--center:#0d1233;--text:#e8ecff;--muted:#8d97c7;--brass:#7df9ff}
.board[data-theme="sunset"]{--line:#4a1d16;--tile:#fff1e0;--center:#8a2f2a;--center-text:#fff1e0;--text:#3b1a12;--muted:#8a5a48;--brass:#ffd37a}
.board[data-theme="mono"]{--line:#1a1a1a;--tile:#f2f2f2;--center:#2a2a2a;--center-text:#f0f0f0;--text:#161616;--muted:#666;--brass:#ffffff}
/* чат */
.chatlist{max-height:min(30vh,240px);overflow:auto;padding:6px 12px;font-size:13px;line-height:1.35;border-top:1px solid rgba(127,150,140,.2)}
.cm{padding:2px 0;overflow-wrap:anywhere}
.cm.mine b{color:var(--accent)}
.quick{display:flex;gap:4px;padding:6px 12px 0;flex-wrap:wrap}
.quick button{border:1px solid var(--btn-bd);background:var(--btn);border-radius:10px;padding:3px 8px;font-size:15px;cursor:pointer}
.chatform{display:flex;gap:6px;padding:8px 12px 10px}
.chatform input{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);font:inherit;font-size:14px}
.chatform .btn{padding:8px 12px}
.chatbox{border:1px solid var(--btn-bd);border-radius:12px;margin-top:12px;overflow:hidden}
.chatbox .chatlist{max-height:130px;border-top:0;min-height:52px}
/* лобби: настройки */
.opts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.lnin{flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);font:inherit;font-weight:600}
.pkprev{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;margin:0 auto 8px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.pkgrid{display:flex;flex-wrap:wrap;gap:6px}
.pke,.pkc{width:42px;height:42px;border-radius:12px;border:2px solid var(--btn-bd);background:var(--btn);font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0}
.pke.on,.pkc.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--accent)}
.pke:disabled,.pkc:disabled{opacity:.25;cursor:not-allowed}
.pkc{border-radius:50%}
.pkc.custom{position:relative;overflow:hidden;font-size:18px}
.pkc.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pc .pn .ordn{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:var(--pc);color:#fff;font-size:10px;font-weight:700;margin-right:4px}
/* аукцион */
.auc{text-align:center;width:min(430px,100%)}
.auc .deed{margin:0 auto 10px;width:min(260px,100%)}
.aucBidRow{font-size:18px;margin:4px 0}
.aucBidRow b{font-family:'Unbounded',sans-serif;font-size:24px}
.aucCd{font-size:13px;color:var(--muted);min-height:1.2em;margin-bottom:8px}
.aucBtns{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.aucForm{display:flex;gap:8px;margin-bottom:8px}
.aucForm input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);font:inherit}
.aucFoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.aucList{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.aucChip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--btn-bd)}
.aucChip.lead{background:var(--accent);color:#fff;border-color:var(--accent)}
.aucChip.out{opacity:.45;text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2b27;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw}
/* фото городов */
.tile.ph .tb{background:linear-gradient(180deg,rgba(0,0,0,.04) 30%,rgba(0,0,0,.74)),var(--img) center/cover no-repeat;color:#fff;justify-content:flex-end}
.tile.ph .nm{text-shadow:0 1px 3px rgba(0,0,0,.85)}
.tile.ph .pr{color:#fff;opacity:.95;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.deed .dimg{height:78px;background-size:cover;background-position:center}
/* видео по центру */
.vid{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.vframe{width:min(100%,max(200px,calc(var(--u)*46)));aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.vempty{color:#cfeee0;font-size:13px;text-align:center;padding:10px;opacity:.9;line-height:1.4}
.vform{display:flex;gap:6px;width:min(100%,max(200px,calc(var(--u)*46)))}
.vform input{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.28);color:#fff;font:inherit;font-size:13px}
.vform input::placeholder{color:rgba(255,255,255,.6)}
.vform .btn{padding:8px 11px}
.vmsg{font-size:12px;color:#ffd9a0}
.center.compact .vframe,.center.compact .vform{width:min(100%,max(200px,calc(var(--u)*32)))}
.center.hasvid .mark{display:none}
.btn{padding:10px 15px;border-radius:12px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;transition:transform .12s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}

.tokens{position:absolute;inset:0;pointer-events:none;z-index:6}
.tok{position:absolute;left:0;top:0;width:calc(var(--u)*3.3*var(--tk,1));height:calc(var(--u)*3.3*var(--tk,1));transform:translate(-50%,-50%);transition:left .17s ease-in-out,top .17s ease-in-out,opacity .6s}
.tokens.noanim .tok{transition:none}
.tin{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*2*var(--tk,1));border:2px solid #fff;box-shadow:0 3px 7px rgba(0,0,0,.45)}
.tok.cur .tin{box-shadow:0 0 0 calc(var(--u)*.4) var(--brass),0 3px 9px rgba(0,0,0,.5);animation:pulse 1.4s infinite}
.tok.gone{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(200deg)}
@keyframes pulse{50%{transform:scale(1.1)}}

.layer{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:var(--overlay);backdrop-filter:blur(4px);overflow:auto}
.layer.on{display:flex}
#modalRoot{z-index:55}
.mc,.sc{background:var(--panel);color:var(--text);border-radius:20px;padding:20px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:mpop .3s}
@keyframes mpop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.mc h3,.sc h2{margin:0 0 10px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:18px}
.mc h4{margin:6px 0;font-size:14px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.sc h2{font-size:28px;font-weight:800;margin-bottom:4px}
.sc .sub{color:var(--muted);margin:0 0 16px;font-size:14px;line-height:1.45}
.fld{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);font:inherit;font-size:16px;margin-bottom:10px}
.fld.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700;font-size:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--btn-bd)}
.big-btn{width:100%;padding:14px;font-size:16px}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin-top:6px}
.codebox{display:flex;align-items:center;gap:10px;background:var(--btn);border:1px dashed var(--btn-bd);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.codebox b{font-family:'Unbounded',sans-serif;font-size:28px;letter-spacing:.18em;flex:1}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.tkbtn{width:42px;height:42px;border-radius:50%;border:2px solid #fff;font-size:22px;cursor:pointer;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tkbtn:disabled{cursor:default}
.lname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sopt{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.sopt select{padding:8px 10px;border-radius:10px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);font:inherit}
.cardm{text-align:center;width:min(380px,100%)}
.who{font-size:13px;color:var(--muted);margin-bottom:8px}
.flip{border-radius:16px;padding:26px 20px;color:#fff;animation:flipin .6s cubic-bezier(.2,.8,.3,1)}
.flip.chance{background:linear-gradient(145deg,#e8892b,#c4571a)}
.flip.chest{background:linear-gradient(145deg,#2f7fd0,#1c4f95)}
.ct{font-family:'Unbounded',sans-serif;font-weight:800;font-size:20px;margin-bottom:12px}
.cx{font-size:16px;line-height:1.4;font-weight:500}
@keyframes flipin{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.mlist{display:flex;flex-direction:column;gap:10px}
.mg{border:1px solid var(--btn-bd);border-radius:12px;overflow:hidden}
.mgh{padding:7px 10px;font-weight:600;font-size:13px;background:rgba(127,150,140,.14);display:flex;align-items:center;gap:7px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;flex:none}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid rgba(127,150,140,.2);flex-wrap:wrap}
.mn{font-weight:500;font-size:14px;flex:1;min-width:110px}
.mrow.mt .mn{opacity:.6}
.mb{display:flex;gap:5px;flex-wrap:wrap}
.mb button{padding:6px 9px;border-radius:9px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);font-size:12px;font-weight:600;cursor:pointer}
.mb button:disabled{opacity:.35;cursor:not-allowed}
.mcash{margin-bottom:8px}
.debt{background:rgba(197,58,58,.14);border:1px solid var(--danger);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tp{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0;cursor:pointer}
.cols label.cashin{display:block;margin-top:8px;font-size:13px}
.cols input[type=number]{width:100%;margin-top:3px;padding:7px 9px;border-radius:9px;border:1px solid var(--btn-bd);background:var(--btn);color:var(--text);font:inherit}
.win{text-align:center}
.trophy{font-size:64px;animation:pulse 1.2s infinite}
.rules p{margin:6px 0;font-size:14px;line-height:1.45}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
#confetti i{position:absolute;top:-16px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(720deg)}}

@media (max-width:900px){
  :root{--bs0:min(calc(100vw - 16px),760px)}
  .board[data-map]{--bs:var(--bs0);--u:calc(var(--bs)/100)}
  .app{flex-direction:column;align-items:center;padding:8px}
  .side{width:min(100%,var(--bs));max-height:none;position:static}
  .players{max-height:none}
}
@media (max-width:440px){.players{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  .die.rolling,.tok.cur .tin,.trophy,.tile.pop,.tile.hl,.tile.hl-auc,.tile.flash{animation:none}
  #confetti{display:none}
}
</style>
</head>
<body>
<div class="conn" id="conn" hidden>Нет связи с сервером. Переподключаюсь…</div>

<!-- Главная -->
<div class="layer on" id="home">
  <div class="sc">
    <h2>МАГНАТ</h2>
    <p class="sub">Настольная экономическая игра для 2–12 игроков. Создай комнату и отправь друзьям код или ссылку: каждый играет со своего устройства.</p>
    <input class="fld" id="hName" placeholder="Твоё имя" maxlength="14" autocomplete="nickname" aria-label="Твоё имя">
    <button class="btn primary big-btn" id="hCreate">Создать комнату</button>
    <div class="or">или войти по коду</div>
    <input class="fld code" id="hCode" placeholder="КОД" maxlength="5" autocomplete="off" aria-label="Код комнаты">
    <button class="btn big-btn" id="hJoin">Войти в комнату</button>
    <div class="err" id="hErr" role="alert"></div>
  </div>
</div>

<!-- Лобби -->
<div class="layer" id="lobby">
  <div class="sc">
    <h2>Комната</h2>
    <div class="codebox"><b id="lcode">-----</b><button class="btn" id="lCopy">Скопировать ссылку</button></div>
    <div id="lrows"></div>
    <div class="opts" id="lopts">
      <label class="sw2"><input type="checkbox" id="oAuc"> 🔨 Аукцион, если отказались покупать</label>
      <label class="sw2"><input type="checkbox" id="oJack"> 💰 Налоги копятся на парковке (джекпот)</label>
    </div>
    <div id="lhost">
      <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" id="lBot">🤖 Добавить бота</button></div>
      <div class="sopt"><label for="lmap">Карта</label>
        <select id="lmap"><option value="auto">Авто (по числу игроков)</option><option value="classic">Классика · 40 клеток (до 6)</option><option value="large">Большая · 48 клеток (7–8)</option><option value="xl">Гигант · 56 клеток (9–10)</option><option value="mega">Мега · 64 клетки (11–12)</option></select></div>
      <div class="sopt"><label for="lcash">Стартовый капитал</label>
        <select id="lcash"><option value="1000">$1 000</option><option value="1500">$1 500</option><option value="2000">$2 000</option><option value="3000">$3 000</option></select></div>
      <div class="row"><button class="btn primary" id="lStart">Начать игру</button></div>
    </div>
    <p class="muted" id="lmapnote" style="margin-top:10px"></p>
    <div class="chatbox"><div class="chatlist" id="lchat" role="log" aria-live="polite"></div>
      <form class="chatform" id="lcform" autocomplete="off"><input id="lcin" maxlength="200" placeholder="Написать в чат…" aria-label="Сообщение в чат"><button class="btn primary" type="submit" aria-label="Отправить">➤</button></form></div>
    <p class="muted" id="lwait" style="margin-top:12px">Ждём, пока хозяин комнаты начнёт игру. Капитал: <b id="lcashv"></b></p>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="lLeave">Выйти из комнаты</button></div>
  </div>
</div>

<!-- Игра -->
<div class="app" id="game" hidden>
  <div id="boardwrap"><div class="board" id="board"></div></div>
  <aside class="side">
    <div class="head">
      <h1 class="logo">МАГНАТ</h1>
      <button class="ibtn" id="bTheme" title="Тема доски" aria-label="Сменить тему доски">🎨</button>
      <button class="ibtn" id="bVid" title="Показать или скрыть видео (звук продолжит играть)" aria-label="Показать или скрыть видео">📺</button>
      <button class="ibtn" id="bSnd" title="Звук" aria-label="Включить или выключить звук">🔊</button>
      <button class="ibtn" id="bRules" title="Правила" aria-label="Правила игры">📖</button>
      <button class="ibtn" id="bExit" title="Выйти" aria-label="Выйти из игры">🚪</button>
    </div>
    <div class="players" id="players"></div>
    <div class="logwrap" id="logwrap">
      <button class="logbar" id="logbar" aria-expanded="false" aria-controls="log"><span>📜 Журнал ходов</span><span class="lbn" id="lognew" hidden></span><span class="lbl" id="loglast">пока пусто</span><span class="lbc">▾</span></button>
      <div class="logbox" id="log" role="log" aria-live="polite" hidden></div>
    </div>
    <div class="logwrap" id="chatwrap">
      <button class="logbar" id="chatbar" aria-expanded="false" aria-controls="chatpanel"><span>💬 Чат</span><span class="lbn" id="chatnew" hidden></span><span class="lbl" id="chatlast">сообщений нет</span><span class="lbc">▾</span></button>
      <div id="chatpanel" hidden>
        <div class="chatlist" id="gchat" role="log" aria-live="polite"></div>
        <div class="quick" id="quick"><button data-q="👍" aria-label="Палец вверх">👍</button><button data-q="😂" aria-label="Смех">😂</button><button data-q="😮" aria-label="Удивление">😮</button><button data-q="😡" aria-label="Злость">😡</button><button data-q="🎉" aria-label="Праздник">🎉</button><button data-q="💸" aria-label="Деньги">💸</button><button data-q="Ходи уже!" >⏰</button></div>
        <form class="chatform" id="gcform" autocomplete="off"><input id="gcin" maxlength="200" placeholder="Сообщение…" aria-label="Сообщение в чат"><button class="btn primary" type="submit" aria-label="Отправить">➤</button></form>
      </div>
    </div>
  </aside>
</div>

<div class="layer" id="modalRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="confetti"></div>

<script src="/data.js"></script>
<script>
const {GROUPS,TOKENS,gk}=MAG;
let MP=MAG.MAPS.classic,BOARD=MP.BOARD,GROUP_IDX=MP.GROUP_IDX,builtMap=null;
function setMap(k){MP=MAG.MAPS[k]||MAG.MAPS.classic;BOARD=MP.BOARD;GROUP_IDX=MP.GROUP_IDX;}
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const money=n=>'$'+Math.round(n).toLocaleString('ru-RU');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const colorOf=i=>GROUPS[gk(BOARD[i])].c;

/* ---------- состояние клиента ---------- */
let ws=null,retry=0,room=null,me=-1,G=null,built=false,curPrompt=null,mm=null,peekT=null,cdTimer=null,prevTurnMe=false;
const shown=[],raf=[];
let session=null;try{session=JSON.parse(localStorage.getItem('magnat')||'null');}catch(e){}
const saveSession=s=>{session=s;try{s?localStorage.setItem('magnat',JSON.stringify(s)):localStorage.removeItem('magnat');}catch(e){}};
const urlRoom=(new URLSearchParams(location.search).get('r')||'').toUpperCase().slice(0,5);
if(urlRoom)$('hCode').value=urlRoom;
try{const n=localStorage.getItem('magnat-name');if(n)$('hName').value=n;}catch(e){}

/* ---------- звук ---------- */
let muted=false,AC=null;
function tone(f,d=.1,type='sine',v=.07,at=0){
  if(muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
function snd(k){
  const m={
    dice:()=>{for(let i=0;i<7;i++)tone(180+Math.random()*220,.05,'square',.035,i*.1)},
    hop:()=>tone(520,.05,'triangle',.045),
    coin:()=>{tone(880,.08,'sine',.06);tone(1320,.12,'sine',.05,.07)},
    pay:()=>{tone(420,.1,'sine',.06);tone(300,.16,'sine',.05,.08)},
    buy:()=>{[523,659,784].forEach((f,i)=>tone(f,.12,'triangle',.06,i*.08))},
    build:()=>{tone(260,.08,'square',.04);tone(390,.1,'square',.04,.07)},
    jail:()=>tone(150,.35,'sawtooth',.05),
    card:()=>{tone(700,.08,'triangle',.05);tone(990,.12,'triangle',.05,.08)},
    bankrupt:()=>{[300,240,180].forEach((f,i)=>tone(f,.2,'sawtooth',.05,i*.15))},
    win:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.07,i*.13))},
    turn:()=>{tone(660,.1,'triangle',.07);tone(880,.16,'triangle',.07,.1)}
  };
  (m[k]||(()=>{}))();
}

/* ---------- сеть ---------- */
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));};
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>{retry=0;$('conn').hidden=true;if(session)send({t:'rejoin',code:session.code,secret:session.secret});};
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(x){return;}onServer(d);};
  ws.onclose=()=>{$('conn').hidden=false;setTimeout(connect,Math.min(5000,500*Math.pow(2,retry++)));};
  ws.onerror=()=>{};
}
setInterval(()=>send({t:'ping'}),25000);

function onServer(d){
  switch(d.t){
    case 'session':saveSession({code:d.code,secret:d.secret});myUid=d.uid;break;
    case 'chat':onChat(d.msg);break;
    case 'chatlog':chat=d.msgs||[];renderChat();break;
    case 'toast':toast(d.msg);break;
    case 'norejoin':saveSession(null);goHome();break;
    case 'kicked':saveSession(null);goHome('Хозяин убрал тебя из комнаты.');break;
    case 'err':$('hErr').textContent=d.msg;break;
    case 'room':onRoom(d);break;
    case 'state':onState(d.s);break;
    case 'ev':onEvent(d);break;
    case 'prompt':
      if(d.seat<0){curPrompt=null;break;}
      curPrompt=d;renderActions();break;
    case 'debt':if(d.seat===me)openManage(d.amt);break;
    case 'debtEnd':if(mm&&mm.debt)closeManage();break;
    case 'tradeOffer':onTradeOffer(d);break;
    case 'video':setVideo(d.video,d.by);break;
  }
}

/* ---------- экраны ---------- */
function show(name){
  $('home').classList.toggle('on',name==='home');
  $('lobby').classList.toggle('on',name==='lobby');
  $('game').hidden=name!=='game';
}
function goHome(msg){
  room=null;G=null;built=false;builtMap=null;offerData=null;curPrompt=null;chat=[];renderChat();renderAuction();pk=null;closeManage();$('modalRoot').classList.remove('on');$('modalRoot').innerHTML='';
  show('home');$('hErr').textContent=msg||'';
}
$('hCreate').onclick=()=>{
  const n=$('hName').value.trim();if(!n){$('hErr').textContent='Введи имя.';$('hName').focus();return;}
  try{localStorage.setItem('magnat-name',n);}catch(e){}
  $('hErr').textContent='';send({t:'create',name:n});
};
$('hJoin').onclick=()=>{
  const n=$('hName').value.trim(),c=$('hCode').value.trim();
  if(!n){$('hErr').textContent='Введи имя.';$('hName').focus();return;}
  if(c.length<5){$('hErr').textContent='Код состоит из 5 букв.';$('hCode').focus();return;}
  try{localStorage.setItem('magnat-name',n);}catch(e){}
  $('hErr').textContent='';send({t:'join',name:n,code:c});
};
$('hCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('hJoin').click();});
$('hName').addEventListener('keydown',e=>{if(e.key==='Enter')($('hCode').value?$('hJoin'):$('hCreate')).click();});

function onRoom(d){
  const prev=room;room=d;me=d.you;
  if(d.state!=='lobby'&&pk){pk=null;closeModal();}
  if(JSON.stringify(d.video||null)!==JSON.stringify(video)){video=d.video||null;renderVideo();}
  if(d.state==='lobby'){
    if(prev&&prev.state!=='lobby'){G=null;built=false;builtMap=null;offerData=null;curPrompt=null;closeManage();$('modalRoot').classList.remove('on');$('modalRoot').innerHTML='';}
    show('lobby');renderLobby();renderPicker();
  }else{
    setMap(d.map);
    if(!built||builtMap!==d.map)buildBoard();
    show('game');renderVideo();
  }
}
function renderLobby(){
  const r=room,isHost=r.host===r.you;
  $('lcode').textContent=r.code;
  const ae=document.activeElement,keep=ae&&ae.dataset&&ae.dataset.nm!==undefined?{v:ae.value,s:ae.selectionStart}:null;
  $('lrows').innerHTML=r.players.map((p,i)=>{
    const mine=i===r.you;
    return `<div class="srow"><button class="tkbtn" data-t="${i}" ${(mine||isHost)?'':'disabled'} style="background:${p.color}" title="Настроить фишку" aria-label="Настроить фишку: ${esc(p.name)}">${p.emoji}</button>`+
    (mine?`<input class="lnin" data-nm value="${esc(p.name)}" maxlength="14" aria-label="Твоё имя">`:`<div class="lname">${esc(p.name)}${p.bot?' 🤖':''}${!p.connected?' · нет связи':''}</div>`)+
    (i===r.host?'<span title="Хозяин комнаты">👑</span>':'')+
    (isHost&&!mine?`<button class="ibtn" data-rm="${i}" title="Убрать" aria-label="Убрать игрока">✕</button>`:'')+`</div>`;
  }).join('');
  if(keep){const n=$('lrows').querySelector('[data-nm]');if(n){n.value=keep.v;n.focus();try{n.setSelectionRange(keep.s,keep.s);}catch(e){}}}
  $('lhost').hidden=!isHost;$('lwait').hidden=isHost;
  $('oAuc').checked=!!(r.opts&&r.opts.auction);$('oJack').checked=!!(r.opts&&r.opts.jackpot);
  $('oAuc').disabled=$('oJack').disabled=!isHost;
  $('lcash').value=String(r.cash);$('lcashv').textContent=money(r.cash);
  $('lmap').value=r.mapSel||'auto';
  const mi=MAG.MAPS[r.map];$('lmapnote').textContent=mi?`Карта: ${mi.label}, ${mi.note}${r.mapSel==='auto'?' (выбрана автоматически)':''}`:'';
  $('lBot').disabled=r.players.length>=12;
  $('lStart').disabled=r.players.length<2;
  $('lStart').textContent=r.players.length<2?'Нужно минимум 2 игрока':'Начать игру';
}
$('lrows').onclick=e=>{
  const t=e.target.closest('[data-t]');if(t&&!t.disabled){openPicker(+t.dataset.t);return;}
  const r=e.target.closest('[data-rm]');if(r)send({t:'remove',seat:+r.dataset.rm});
};
$('lrows').onchange=e=>{if(e.target.dataset.nm!==undefined){const n=e.target.value.trim();if(n)send({t:'name',name:n});}};
const sendOpts=()=>send({t:'opts',auction:$('oAuc').checked,jackpot:$('oJack').checked});
$('oAuc').onchange=sendOpts;$('oJack').onchange=sendOpts;

/* ---------- кастомизация фишки ---------- */
let pk=null;
function openPicker(seat){pk={seat};openModal('picker');renderPicker();}
function renderPicker(){
  if(!pk||!room)return;
  const m=$('modalRoot').firstChild;if(!m)return;
  const target=room.players[pk.seat];if(!target){pk=null;closeModal();return;}
  const others=room.players.filter((_,j)=>j!==pk.seat),usedE=new Set(others.map(q=>q.emoji)),usedC=new Set(others.map(q=>q.color));

const PHOTO_OVERRIDE={};
const PHOTO={};
let PH={};try{PH=JSON.parse(localStorage.getItem('magnat-photos-v1')||'{}');}catch(e){}
function applyPhoto(i,src){PHOTO[i]=src;const el=$('tile'+i);if(el){el.style.setProperty('--img','url("'+src+'")');el.classList.add('ph');}}
function loadPhotos(){
  BOARD.forEach((t,i)=>{

    const title=t.name.replace(/\u2011/g,'-');

      .then(r=>r.ok?r.json():null)

          applyPhoto(i,s);
        }
      }).catch(()=>{});

}

/* ---------- YouTube ---------- */
let video=null,vidOpen=window.innerWidth>=640;
function parseYT(s){
  s=(s||'').trim();if(!s)return null;
  if(/^[\w-]{11}$/.test(s))return{kind:'v',id:s};
  let u;try{u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s);}catch(e){return null;}
  const h=u.hostname.replace(/^(www|m)\./,'');
  const list=u.searchParams.get('list');
  let id=null;
  if(h==='youtu.be')id=u.pathname.slice(1).split('/')[0];
  else if(['youtube.com','music.youtube.com','youtube-nocookie.com'].includes(h)){
    if(u.pathname==='/watch')id=u.searchParams.get('v');
    else{const m=u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/);if(m)id=m[1];}
  }else return null;
  if(id&&/^[\w-]{11}$/.test(id))return{kind:'v',id};
  if(list&&/^[\w-]{10,60}$/.test(list))return{kind:'p',id:list};
  return null;
}
const embedUrl=v=>v.kind==='v'
  ?'https://www.youtube-nocookie.com/embed/'+v.id+'?autoplay=1&rel=0&playsinline=1'
  :'https://www.youtube-nocookie.com/embed/videoseries?list='+v.id+'&autoplay=1&rel=0&playsinline=1';
function renderVideo(){
  const fr=$('vframe'),c=$('center');if(!fr||!c)return;
  c.classList.toggle('hasvid',vidOpen);$('vid').hidden=!vidOpen;
  const key=video?video.kind+video.id:'';
  if(fr.dataset.key===key&&fr.firstChild)return;
  fr.dataset.key=key;fr.innerHTML='';
  if(!video){fr.innerHTML='<div class="vempty">Вставь ссылку на YouTube ниже:<br>видео включится у всех в комнате</div>';return;}
  const f=document.createElement('iframe');
  f.src=embedUrl(video);f.title='YouTube';
  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;
  f.referrerPolicy='strict-origin-when-cross-origin';
  fr.appendChild(f);
}

/* ---------- фишки ---------- */
const U=()=>$('board').offsetWidth/100;
function tilePoint(i){const el=$('tile'+i);return[el.offsetLeft+el.offsetWidth/2,el.offsetTop+el.offsetHeight/2];}
function createTokens(){
  const L=$('tokens');L.innerHTML='';
  G.players.forEach(p=>{
    const e=document.createElement('div');e.className='tok'+(p.bankrupt?' gone':'');e.id='tok'+p.id;
    e.innerHTML=`<div class="tin" style="background:${p.color}">${p.emoji}</div>`;L.appendChild(e);
  });
  relayout();
}
function place(id,x,y){const e=$('tok'+id);if(e){e.style.left=x+'px';e.style.top=y+'px';}}
function layoutTokens(){
  if(!G||!$('tokens')||!$('tok0'))return;
  const by={};G.players.filter(p=>!p.bankrupt).forEach(p=>(by[p.pos]=by[p.pos]||[]).push(p));
  const u=U();
  for(const k in by){
    const arr=by[k],[x,y]=tilePoint(k),cols=Math.ceil(Math.sqrt(arr.length)),rows=Math.ceil(arr.length/cols);
    arr.forEach((p,j)=>{const r=Math.floor(j/cols),c=j%cols;place(p.id,x+(c-(cols-1)/2)*3.1*MP.tk*u,y+(r-(rows-1)/2)*3.1*MP.tk*u);});
  }
}
function relayout(){const L=$('tokens');if(!L)return;L.classList.add('noanim');layoutTokens();requestAnimationFrame(()=>requestAnimationFrame(()=>L.classList.remove('noanim')));}
window.addEventListener('resize',()=>{if(G&&built)relayout();});
function hop(pid,pos){
  const e=$('tok'+pid);if(!e)return;

/* ---------- состояние ---------- */
function onState(s){
  G=s;

  if(!$('tok0')||$('tokens').children.length!==G.players.length)createTokens();
  G.players.forEach(p=>{
    if(shown[p.id]===undefined)shown[p.id]=p.cash;
    if(shown[p.id]!==p.cash)tweenCash(p.id,p.cash);
    const t=$('tok'+p.id);if(t){t.classList.toggle('cur',G.turn===p.id&&!p.bankrupt&&!G.over);t.classList.toggle('gone',p.bankrupt);}
  });
  for(let i=0;i<BOARD.length;i++)if(['street','station','util'].includes(BOARD[i].type))updateTile(i,false);
  if(G.waiting)G.waiting.dl=Date.now()+G.waiting.left;
  if(G.auction)G.auction.dl=Date.now()+G.auction.left;
  renderPlayers();renderActions();renderAuction();if(offerData)renderOffer();
  const pv=$('potv');if(pv)pv.textContent=G.opts&&G.opts.jackpot?'💰 '+money(G.pot):'';
  if(mm){const stale=!mm.debt&&!mm.trade&&(!G.waiting||G.waiting.seat!==me)&&!(G.offer&&G.offer.to===me);if(stale)closeManage();else if(!mm.trade)renderManage();}
  const mine=!!G.waiting&&G.waiting.seat===me&&G.waiting.phase==='pre';

  prevTurnMe=mine;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.title='Магнат — онлайн-игра на 2–12 игроков';});
function tweenCash(id,to){
  const from=shown[id],t0=performance.now(),D=600;
  cancelAnimationFrame(raf[id]);
  const step=t=>{
    const k=Math.min(1,(t-t0)/D);shown[id]=Math.round(from+(to-from)*k);
    const el=document.querySelector('#pc'+id+' .cash');if(el&&!(G&&G.players[id].bankrupt))el.textContent=money(shown[id]);
    if(k<1)raf[id]=requestAnimationFrame(step);
  };

}

/* ---------- события ---------- */
function onEvent(d){
  switch(d.k){
    case 'log':addLog(d.pid,d.msg);break;
    case 'banner':banner(d.text);break;
    case 'sound':snd(d.s);break;
    case 'dice':animDice(d.a,d.b);break;
    case 'hop':hop(d.pid,d.pos);break;
    case 'layout':layoutTokens();break;
    case 'jail':{const e=$('tok'+d.pid);if(e){e.style.transitionDuration='.55s';layoutTokens();setTimeout(()=>{e.style.transitionDuration='';},650);}break;}
    case 'cash':floatMoney(d.pid,d.d);break;
    case 'pop':updateTile(d.i,true);break;
    case 'card':showCard(d);break;
    case 'buy':flashTile(d.i);break;
    case 'bankrupt':{const e=$('tok'+d.pid);if(e)e.classList.add('gone');break;}
    case 'win':showWin(d);break;
  }
}
function animDice(a,b){
  snd('dice');
  const d1=$('d1'),d2=$('d2');if(!d1)return;
  d1.classList.add('rolling');d2.classList.add('rolling');
  const iv=setInterval(()=>{setDie(d1,1+rnd(6));setDie(d2,1+rnd(6));},75);
  setTimeout(()=>{clearInterval(iv);d1.classList.remove('rolling');d2.classList.remove('rolling');setDie(d1,a);setDie(d2,b);},800);
}

/* ---------- имущество ---------- */
const meP=()=>G.players[me];
function canBuild(p,i){
  const t=BOARD[i];if(t.type!=='street'||G.owner[i]!==p.id)return false;
  const g=GROUP_IDX[t.grp];if(!g.every(j=>G.owner[j]===p.id&&!G.mort[j]))return false;
  if(G.houses[i]>=5)return false;
  if(G.houses[i]>Math.min(...g.map(j=>G.houses[j])))return false;
  return p.cash>=GROUPS[t.grp].house;
}
function canSell(p,i){
  const t=BOARD[i];if(t.type!=='street'||G.owner[i]!==p.id||G.houses[i]<1)return false;
  return G.houses[i]===Math.max(...GROUP_IDX[t.grp].map(j=>G.houses[j]));
}
function canMortgage(p,i){
  const t=BOARD[i];if(G.owner[i]!==p.id||G.mort[i])return false;
  if(t.type==='street')return GROUP_IDX[t.grp].every(j=>G.houses[j]===0);
  return true;
}
const unmortCost=i=>Math.ceil(BOARD[i].price/2*1.1);
const canUnmortgage=(p,i)=>G.owner[i]===p.id&&G.mort[i]&&p.cash>=unmortCost(i);

function openManage(debt){mm={debt:debt||0};openModal('manage');renderManage();}
function closeManage(){if(mm){mm=null;closeModal();}}
function renderManage(){
  if(!mm||!G)return;
  const m=$('modalRoot').firstChild;if(!m)return;
  const p=meP(),debt=mm.debt;
  const keys=Object.keys(GROUPS).filter(g=>GROUP_IDX[g]&&GROUP_IDX[g].some(i=>G.owner[i]===p.id));
  const rows=keys.map(g=>{
    const mine=GROUP_IDX[g].filter(i=>G.owner[i]===p.id),full=GROUP_IDX[g].every(i=>G.owner[i]===p.id);
    return `<div class="mg"><div class="mgh"><i class="sw" style="background:${GROUPS[g].c}"></i>${GROUPS[g].name}${full&&GROUPS[g].house?' · набор собран':''}</div>`+mine.map(i=>{
      const t=BOARD[i],h=G.houses[i],btn=[];
      if(t.type==='street'){
        btn.push(`<button data-a="b" data-i="${i}" ${canBuild(p,i)?'':'disabled'}>＋ дом ${money(GROUPS[g].house)}</button>`);
        if(h>0)btn.push(`<button data-a="s" data-i="${i}" ${canSell(p,i)?'':'disabled'}>− продать +${money(GROUPS[g].house/2)}</button>`);
      }
      if(G.mort[i])btn.push(`<button data-a="u" data-i="${i}" ${canUnmortgage(p,i)?'':'disabled'}>Выкупить −${money(unmortCost(i))}</button>`);
      else btn.push(`<button data-a="m" data-i="${i}" ${canMortgage(p,i)?'':'disabled'}>Заложить +${money(t.price/2)}</button>`);
      return `<div class="mrow${G.mort[i]?' mt':''}"><span class="mn">${t.name}${G.mort[i]?' (в залоге)':''}</span><span>${h===5?'🏨':'🏠'.repeat(h)}</span><span class="mb">${btn.join('')}</span></div>`;
    }).join('')+'</div>';
  }).join('')||'<p class="muted">Пока нет имущества. Купи улицу, когда на неё встанешь.</p>';
  m.innerHTML=`<h3>🏘 Моё имущество</h3><div class="mcash">В кассе: <b>${money(p.cash)}</b></div>`+
    (offerData&&offerData.to===me&&offerData.rc>0?`<div class="debt">Для обмена нужно отдать ${money(offerData.rc)}. В кассе ${money(p.cash)}${p.cash>=offerData.rc?': хватает ✓':': не хватает '+money(offerData.rc-p.cash)}.</div>`:'')+
    (debt?`<div class="debt">Нужно заплатить ${money(debt)}. ${p.cash>=debt?'Денег хватает.':'Не хватает '+money(debt-p.cash)+': продай дома или заложи улицы.'}</div>`:'')+
    `<div class="mlist">${rows}</div><div class="row">`+
    (debt?`<button class="btn primary" data-f="ok" ${p.cash>=debt?'':'disabled'}>Заплатить</button><button class="btn danger" data-f="bank">Объявить банкротство</button>`:(tradeDraft?`<button class="btn" data-f="trade">← Вернуться к обмену</button>`:'')+`<button class="btn primary" data-f="ok">Готово</button>`)+`</div>`;
  m.onclick=e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.f==='trade'){closeManage();openTrade();return;}
    if(b.dataset.f){const d=mm&&mm.debt;closeManage();if(d)send({t:'debtDone',bankrupt:b.dataset.f==='bank'});return;}
    send({t:'manage',a:b.dataset.a,i:+b.dataset.i});
  };
}

/* ---------- обмен ---------- */
const tradable=i=>{const t=BOARD[i];return t.type!=='street'||GROUP_IDX[t.grp].every(j=>G.houses[j]===0);};
const tradeLine=(list,cash)=>{const a=list.map(i=>BOARD[i].name);if(cash)a.push(money(cash));return a.length?a.join(', '):'ничего';};
let tradeDraft=null,offerData=null;
function liquid(pl){let v=pl.cash;BOARD.forEach((t,i)=>{if(G.owner[i]!==pl.id)return;if(!G.mort[i])v+=t.price/2;if(t.type==='street')v+=G.houses[i]*GROUPS[t.grp].house/2;});return Math.floor(v);}
function openTrade(){
  const w=G.waiting;if(!w||w.seat!==me||!curPrompt)return;
  const others=G.players.filter(x=>!x.bankrupt&&x.id!==me);if(!others.length)return;
  const p=meP();
  const dr=tradeDraft&&others.some(x=>x.id===tradeDraft.q)?tradeDraft:null;
  let q=dr?dr.q:others[0].id;
  const S2={give:new Set(dr?dr.give:[]),get:new Set(dr?dr.get:[]),gc:dr?dr.gc:0,rc:dr?dr.rc:0};
  const save=()=>{tradeDraft={q,give:[...S2.give],get:[...S2.get],gc:S2.gc,rc:S2.rc};};
  const m=openModal('trade');mm={debt:0,trade:true};
  const render=()=>{
    const o=G.players[q],me2=meP(),lo=liquid(o);
    const list=(pl,set)=>BOARD.map((_,i)=>i).filter(i=>G.owner[i]===pl.id&&tradable(i)).map(i=>`<label class="tp"><input type="checkbox" data-s="${set}" data-i="${i}" ${S2[set].has(i)?'checked':''}><i class="sw" style="background:${colorOf(i)}"></i>${BOARD[i].name}${G.mort[i]?' (залог)':''}</label>`).join('')||'<div class="muted">нет доступных</div>';
    m.innerHTML=`<h3>🤝 Обмен</h3><div class="pick">${others.map(x=>`<button class="chip${x.id===q?' on':''}" data-q="${x.id}">${x.emoji} ${esc(x.name)}</button>`).join('')}</div>`+
      `<div class="cols"><div><h4>Ты отдаёшь</h4>${list(me2,'give')}<label class="cashin">Деньги (в кассе ${money(me2.cash)})<input type="number" min="0" max="${me2.cash}" value="${S2.gc}" data-c="gc"></label><button class="btn mini" data-mg="1">🏦 Заложить имущество, чтобы набрать денег</button></div>`+
      `<div><h4>Ты получаешь</h4>${list(o,'get')}<label class="cashin">Деньги (до ${money(lo)})<input type="number" min="0" max="${lo}" value="${S2.rc}" data-c="rc"></label><div class="muted">В кассе у ${esc(o.name)} ${money(o.cash)}. Недостающее он сможет добрать закладом.</div></div></div>`+
      `<div class="err" id="terr"></div><div class="row"><button class="btn primary" data-go="1">Предложить</button><button class="btn" data-x="1">Отмена</button></div>`;
  };
  m.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.q){q=+b.dataset.q;S2.get.clear();S2.rc=0;render();}
    else if(b.dataset.mg){save();closeManage();openManage(0);}
    else if(b.dataset.x){tradeDraft=null;closeManage();}
    else if(b.dataset.go){
      const o=G.players[q];
      if(S2.gc>meP().cash){$('terr').textContent='Тебе не хватает денег: заложи имущество или уменьши сумму.';return;}
      if(S2.rc>liquid(o)){$('terr').textContent='У '+o.name+' не наберётся столько даже с закладом.';return;}
      if(!S2.give.size&&!S2.get.size&&!S2.gc&&!S2.rc){$('terr').textContent='Выбери, что обменять.';return;}
      tradeDraft=null;closeManage();
      send({t:'act',id:w.id,choice:'trade',data:{q,give:[...S2.give],get:[...S2.get],gc:S2.gc,rc:S2.rc}});
    }
  };
  m.onchange=e=>{const t=e.target;if(t.type==='checkbox'){const set=S2[t.dataset.s],i=+t.dataset.i;t.checked?set.add(i):set.delete(i);}};
  m.oninput=e=>{const t=e.target;if(t.dataset.c)S2[t.dataset.c]=Math.max(0,Math.min(+t.max,Math.floor(+t.value||0)));};
  render();
}
function onTradeOffer(d){
  if(d.close){offerData=null;cpHide('offer');clearHighlight();return;}
  if(!G)return;
  offerData=d;snd('card');renderOffer();

function renderOffer(){
  const d=offerData;if(!d||!G||!$('cpanel'))return;
  const from=G.players[d.from],to=G.players[d.to],mine=d.to===me;
  const chips=l=>l.map(i=>`<span class="tchip"><i class="sw" style="background:${colorOf(i)}"></i>${BOARD[i].name}${G.mort[i]?' (залог)':''}</span>`).join('');
  const side=(pl,list,cash)=>`<div class="ofside"><div class="ofh"><span class="tkx" style="background:${pl.color}">${pl.emoji}</span>${esc(pl.name)} отдаёт</div>${chips(list)}${cash?`<span class="tchip cash">💵 ${money(cash)}</span>`:''}${!list.length&&!cash?'<span class="muted">ничего</span>':''}</div>`;
  const have=G.players[d.to].cash,need=mine&&d.rc>0?Math.max(0,d.rc-have):0;
  let html=`<h3>🤝 Предложение обмена</h3><div class="ofcols">${side(from,d.give,d.gc)}<div class="ofarrow">⇄</div>${side(to,d.get,d.rc)}</div>`;
  if(mine){
    if(need)html+=`<div class="need">Нужно отдать ${money(d.rc)}, а в кассе ${money(have)}. Не хватает ${money(need)}: заложи имущество, и кнопка «Принять» откроется.</div>`;
    html+=`<div class="row ctr"><button class="btn primary" data-y="1" ${need?'disabled':''}>Принять</button><button class="btn" data-y="0">Отказаться</button><button class="btn" data-mg="1">🏦 Имущество</button></div>`;
  }else html+=`<div class="muted">Ждём ответа: ${esc(to.name)}…</div>`;
  const p=cpShow('offer',html);
  p.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mg){openManage(0);return;}send({t:'tradeReply',id:d.id,ok:b.dataset.y==='1'});};
  setHighlight(d.give.map(i=>({i,label:'→ '+to.name,cls:'hl'})).concat(d.get.map(i=>({i,label:'→ '+from.name,cls:'hl'}))));
}

  $('aucPass').disabled=!can;

  $('aucList').innerHTML=G.players.filter(x=>!x.bankrupt).map(x=>`<span class="aucChip${A.leader===x.id?' lead':''}${A.passed.includes(x.id)?' out':''}">${x.emoji} ${esc(x.name)}</span>`).join('');

  <p><b>Карты:</b> для 2–6 игроков доска на 40 клеток, для 7–8 на 48, для 9–10 на 56, для 11–12 на 64. Хозяин комнаты может выбрать карту вручную в лобби.</p>
  <p><b>Аукцион:</b> если отказался покупать, клетку продают всем. Ставки от $10, торги закрываются через 11 секунд без новых ставок.</p>
  <p><b>Обмен и заклад:</b> в обмене можно просить деньги, которых у игрока сейчас нет, если у него есть что заложить. Перед согласием он закладывает имущество, и кнопка «Принять» открывается.</p>
  <p><b>Тюрьма:</b> выйти можно за $50, картой, дублем или после третьей неудачной попытки.</p>
  <p><b>Долги:</b> если не хватает денег, продай дома и заложи улицы. Если и это не помогает, ты банкрот.</p>
  <p><b>Время:</b> на ход даётся 90 секунд, потом решение принимает бот. Если связь пропала, бот ходит за тебя и отдаёт управление, когда ты вернёшься.</p>
  <p><b>Видео:</b> вставь ссылку на YouTube под плеером в центре доски. Видео включится у всех игроков комнаты. Кнопка 📺 в боковой панели скрывает плеер, звук при этом продолжает играть. Некоторые ролики запрещают встраивание и не откроются.</p>
